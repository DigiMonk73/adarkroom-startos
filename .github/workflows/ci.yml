# Tests the package and plays the game on every push, then builds the s9pk
# with Start9's standard build: one per architecture, attached to the run as
# artifacts (download one and sideload it in StartOS).
name: CI

on:
  push:
    paths-ignore: ['*.md', 'docs/**']
  # Pull requests from forks; a branch of this repository is covered by its push.
  pull_request:
    branches: ['master']
    paths-ignore: ['*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: node scripts/check-manifest.mjs
      - run: npm run format:check
      - name: Graphics layer parses
        run: for f in graphics/js/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test 'tests/unit/*.test.mjs'
      - name: Shell scripts
        run: shellcheck scripts/*.sh

  game:
    name: Game tests (Docker image)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Build the image
        run: docker build -t adarkroom-graphics:ci .
      - name: Start it the way StartOS does
        run: |
          docker run -d --name game -p 8080:80 --entrypoint nginx adarkroom-graphics:ci -g 'daemon off;'
          for _ in $(seq 30); do curl -sf -o /dev/null http://localhost:8080/ && exit 0; sleep 1; done
          docker logs game
          exit 1
      - name: Install Playwright
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Play the game
        working-directory: tests
        env:
          BASE_URL: http://localhost:8080
          CHECK_IMAGE: '1'
        run: npx playwright test
      - name: nginx log
        if: failure()
        run: docker logs game
      - name: Keep the report, screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            tests/playwright-report
            tests/test-results
          retention-days: 7

  s9pk:
    name: Build s9pk
    needs: [package, game]
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
