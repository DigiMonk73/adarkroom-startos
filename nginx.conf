# The game is static files, served on port 80 (startos/utils.ts).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # What players load is nobody's business; errors still reach the log.
    access_log off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # The page, scripts and styles are revalidated on every load (a cheap
    # 304), so a package update shows up without clearing the cache.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # Sound and images are large and change rarely.
    location ~* \.flac$ {
        types { audio/flac flac; }
        expires 7d;
    }
    location ~* \.(?:png|jpe?g|ico)$ {
        expires 7d;
    }
}
